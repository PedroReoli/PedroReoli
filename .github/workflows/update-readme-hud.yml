name: Hourly Profile Activity Update

on:
  schedule:
    - cron: '0 * * * *' # Hourly update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Compact Activity SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-hud.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/profile-activity.svg
          git rm --ignore-unmatch assets/profile-hud.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "build: hourly activity update [skip ci]" && git push)
