<svg fill="none" width="800" height="110" viewBox="0 0 800 110" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes pulseGlow {
          0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
          50% { opacity: 0.3; filter: drop-shadow(0 0 1px #10b981); }
        }
        .status-card {
          font-family: 'Inter', -apple-system, system-ui, sans-serif;
          background: #090d16;
          background-image: radial-gradient(circle at 10% 50%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
                            radial-gradient(circle at 90% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 50%);
          border-radius: 12px;
          padding: 16px 24px;
          color: #f8fafc;
          border: 1px solid rgba(255, 255, 255, 0.08);
          box-sizing: border-box;
          height: 110px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .left-content {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .badge-row {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .live-dot {
          width: 7px;
          height: 7px;
          background-color: #10b981;
          border-radius: 50%;
          animation: pulseGlow 1.8s infinite ease-in-out;
        }
        .badge-text {
          font-size: 10px;
          font-weight: 700;
          color: #34d399;
          letter-spacing: 1px;
          font-family: monospace;
          text-transform: uppercase;
        }
        .repo-title {
          font-size: 18px;
          font-weight: 800;
          color: #f1f5f9;
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .repo-name {
          background: linear-gradient(90deg, #38bdf8, #a855f7);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .right-content {
          display: flex;
          flex-direction: column;
          align-items: flex-end;
          gap: 6px;
        }
        .tech-tag {
          background: rgba(56, 189, 248, 0.1);
          border: 1px solid rgba(56, 189, 248, 0.25);
          color: #38bdf8;
          font-size: 11px;
          font-weight: 600;
          padding: 3px 10px;
          border-radius: 12px;
          font-family: monospace;
        }
        .update-time {
          font-size: 10px;
          color: #64748b;
          font-family: monospace;
        }
      </style>
      <div class="status-card">
        <div class="left-content">
          <div class="badge-row">
            <div class="live-dot"></div>
            <span class="badge-text">ÚLTIMO REPOSITÓRIO PÚBLICO ALTERADO</span>
          </div>
          <div class="repo-title">
            <span style="color: #64748b;">PedroReoli /</span>
            <span class="repo-name">PedroReoli</span>
          </div>
        </div>

        <div class="right-content">
          <div class="tech-tag">JavaScript</div>
          <div class="update-time">Sincronizado: 23/09/2026, 20:32</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>