<svg fill="none" width="850" height="340" viewBox="0 0 850 340" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes fadeInHUD {
          0% { opacity: 0; transform: translateY(15px) scale(0.98); }
          100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes rotate3D {
          0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
          50% { transform: rotateX(180deg) rotateY(180deg) rotateZ(90deg); }
          100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(180deg); }
        }
        @keyframes pulseGlow {
          0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 8px #38bdf8); }
          50% { opacity: 0.4; filter: drop-shadow(0 0 2px #38bdf8); }
        }
        @keyframes scanline {
          0% { top: 0%; }
          100% { top: 100%; }
        }
        .hud-wrapper {
          font-family: 'Inter', system-ui, -apple-system, sans-serif;
          background: #030712;
          background-image: 
            radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
            radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.12) 0%, transparent 45%),
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
          background-size: 100% 100%, 100% 100%, 20px 20px, 20px 20px;
          border-radius: 18px;
          padding: 24px 30px;
          color: #f8fafc;
          border: 1px solid rgba(56, 189, 248, 0.2);
          box-sizing: border-box;
          height: 340px;
          position: relative;
          overflow: hidden;
          animation: fadeInHUD 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        .scan-bar {
          position: absolute;
          left: 0;
          width: 100%;
          height: 2px;
          background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.4), transparent);
          animation: scanline 4s linear infinite;
        }
        .hud-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
          padding-bottom: 14px;
          margin-bottom: 20px;
        }
        .brand {
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .cube-container {
          width: 28px;
          height: 28px;
          perspective: 600px;
        }
        .cube-wireframe {
          width: 100%;
          height: 100%;
          position: relative;
          transform-style: preserve-3d;
          animation: rotate3D 12s linear infinite;
        }
        .cube-face {
          position: absolute;
          width: 24px;
          height: 24px;
          border: 1.5px solid #38bdf8;
          background: rgba(56, 189, 248, 0.05);
          box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }
        .face-front  { transform: rotateY(0deg) translateZ(12px); }
        .face-back   { transform: rotateY(180deg) translateZ(12px); }
        .face-right  { transform: rotateY(90deg) translateZ(12px); }
        .face-left   { transform: rotateY(-90deg) translateZ(12px); }
        .face-top    { transform: rotateX(90deg) translateZ(12px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(12px); }

        .title {
          font-size: 16px;
          font-weight: 800;
          letter-spacing: 1px;
          background: linear-gradient(90deg, #38bdf8, #a855f7, #ec4899);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          font-family: monospace;
        }
        .live-tag {
          display: flex;
          align-items: center;
          gap: 8px;
          background: rgba(56, 189, 248, 0.1);
          border: 1px solid rgba(56, 189, 248, 0.3);
          color: #38bdf8;
          font-size: 11px;
          font-weight: 700;
          padding: 4px 12px;
          border-radius: 20px;
          letter-spacing: 0.5px;
          font-family: monospace;
        }
        .pulse-dot {
          width: 8px;
          height: 8px;
          background-color: #38bdf8;
          border-radius: 50%;
          animation: pulseGlow 1.5s infinite ease-in-out;
        }
        .hud-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 16px;
          margin-bottom: 20px;
        }
        .card {
          background: rgba(15, 23, 42, 0.6);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 12px;
          padding: 16px;
          backdrop-filter: blur(8px);
          position: relative;
        }
        .card::before {
          content: '';
          position: absolute;
          top: -1px;
          left: 10px;
          width: 20px;
          height: 2px;
          background: #38bdf8;
          box-shadow: 0 0 6px #38bdf8;
        }
        .card-label {
          font-size: 10px;
          color: #64748b;
          text-transform: uppercase;
          letter-spacing: 1px;
          margin-bottom: 6px;
          font-weight: 700;
          font-family: monospace;
        }
        .card-val {
          font-size: 20px;
          font-weight: 800;
          color: #f1f5f9;
        }
        .card-sub {
          font-size: 11px;
          color: #38bdf8;
          margin-top: 4px;
          font-weight: 500;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .footer-bar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-top: 1px solid rgba(255, 255, 255, 0.08);
          padding-top: 14px;
          font-size: 11px;
          color: #64748b;
          font-family: monospace;
        }
        .timestamp {
          color: #a855f7;
          font-weight: 700;
        }
      </style>
      <div class="hud-wrapper">
        <div class="scan-bar"></div>
        <div class="hud-header">
          <div class="brand">
            <div class="cube-container">
              <div class="cube-wireframe">
                <div class="cube-face face-front"></div>
                <div class="cube-face face-back"></div>
                <div class="cube-face face-right"></div>
                <div class="cube-face face-left"></div>
                <div class="cube-face face-top"></div>
                <div class="cube-face face-bottom"></div>
              </div>
            </div>
            <div class="title">REOLI OS // CYBER HUD v2.4</div>
          </div>
          <div class="live-tag">
            <div class="pulse-dot"></div>
            AUTONOMOUS ENGINE
          </div>
        </div>

        <div class="hud-grid">
          <div class="card">
            <div class="card-label">🔥 ÚLTIMO PROJETO ATIVO</div>
            <div class="card-val" style="font-size: 16px;">PedroReoli</div>
            <div class="card-sub">Stack: JavaScript</div>
          </div>

          <div class="card">
            <div class="card-label">⚡ REPOSITÓRIOS PÚBLICOS</div>
            <div class="card-val">17</div>
            <div class="card-sub">Ativos &amp; Open Source</div>
          </div>

          <div class="card">
            <div class="card-label">🧠 ARQUITETURA &amp; IA</div>
            <div class="card-val" style="font-size: 15px;">Spec-Driven Engine</div>
            <div class="card-sub">Agents &amp; Full Stack</div>
          </div>
        </div>

        <div class="footer-bar">
          <span>HOST: PEDRO REOLI</span>
          <span>ÚLTIMA ATUALIZAÇÃO: <span class="timestamp">22/09/2026, 13:42</span></span>
          <span>STATUS: ONLINE</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>